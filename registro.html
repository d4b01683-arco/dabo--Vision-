<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Transportista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caja">
        <h1 style="color:#0056b3;">🚗 Registro Transportista</h1>
        <form action="https://wa.me/221XXXXXXXX" method="get" target="_blank">
            <input type="text" name="text" placeholder="Nombre Completo" required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="text" name="text" placeholder="Ciudad: Dakar, Bamako..." required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="tel" name="text" placeholder="WhatsApp" required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="text" name="text" placeholder="Tipo: Taxi, Moto, Camión" required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <button type="submit" class="boton boton-pago">ENVIAR REGISTRO POR WHATSAPP</button>
        </form>
    </div>
</body>
</html>
