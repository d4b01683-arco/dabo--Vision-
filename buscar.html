<!DOCTYPE html>
<html lang="es">
<head>

    <title>Pedir Transporte</title>

</head>
<body>
    <div class="caja">
        <h1 style="color:#0056b3;">🔍 Pedir Transporte</h1>
        <form action="https://wa.me/221XXXXXXXX" method="get" target="_blank">
            <input type="text" name="text" placeholder="¿Desde dónde?" required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="text" name="text" placeholder="¿Hasta dónde?" required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="text" name="text" placeholder="¿Qué necesitas? Taxi, Moto, Camión" required style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <input type="text" name="text" placeholder="Fecha y Hora" style="width:90%; padding:12px; margin:10px; border-radius:8px; border:1px solid #ccc;">
            <button type="submit" class="boton" style="background:#25D366;">📲 PEDIR POR WHATSAPP</button>
        </form>
    </div>
</body>
</html>
